[package]
name = "nix-host-rs"
version = "0.1.0"
edition = "2024"
license = "LGPL-2.1-or-later"
description = "C ABI facade for independent store, fetcher and build policy crates"

[workspace]
members = ["crates/store-stream", "crates/fetch-registry", "crates/build-scheduler"]
resolver = "3"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nix-store-stream = { path = "crates/store-stream" }
nix-fetch-registry = { path = "crates/fetch-registry" }
nix-build-scheduler = { path = "crates/build-scheduler" }

[dev-dependencies]
sha2 = "0.10"

[lints]
workspace = true

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
