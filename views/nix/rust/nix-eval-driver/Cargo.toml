[package]
name = "nix-eval-driver"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "A Rust-native evaluation driver over nix-eval-rs: evaluate and instantiate without the C++ CLI"

# The production runtime is a shared library loaded by libflake and libcmd.
# This standalone evaluator driver supplies its own host through the Rust API;
# its argv parser and filesystem host stay outside that shared runtime.

[[bin]]
name = "nix-eval-driver"
path = "src/main.rs"

[dependencies]
nix-eval-rs = { path = "../nix-eval-rs" }

[lints]
workspace = true
