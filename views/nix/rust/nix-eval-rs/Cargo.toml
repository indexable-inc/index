[package]
name = "nix-eval-rs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Rust evaluator for the Nix language, exposed to cppnix over a C ABI"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Global allocator for every Rust allocation in the evaluator, whichever
# binary links the staticlib. Measured on ENG-13148, LD_PRELOAD A/B/A/B on
# nixosConfigurations.hil-compute-2 toplevel (dc6, cd482f815): 95.0/98.6s cpu
# on glibc malloc vs 82.9/83.1s on mimalloc, identical output sha -- ~13%,
# because the profile spends ~17% in the allocator (perf record, same box).
# The bundled build (libmimalloc-sys) compiles its own C, so no meson or
# package plumbing carries it.
#
# `no_thp` (Linux only): mimalloc 3.0.2 madvises MADV_HUGEPAGE on every
# arena it maps, and under thp defrag=madvise every fault in such a region
# compacts memory synchronously. Measured on dc4 (goals/rust-eval.md, THP
# A/B, cold hil-compute-1 toplevel): the same run took 74.9 s or 87.5 s of
# wall (3.9 s vs 16.8 s of system time, 3k vs 13k compaction stalls)
# depending on how fragmented free memory was, while THP-off ran 77.4-78.1 s
# with zero stalls. The feature defines MI_NO_THP, which compiles out that
# madvise (prim.c, the only site that reads it); under enabled=madvise a
# region never advised never gets a huge page. It does not touch the
# process-wide prctl(PR_SET_THP_DISABLE): that is the runtime allow_thp
# option (MIMALLOC_ALLOW_THP=0). Verified on dc4: a 79.3 s run of this build
# moved thp_fault_alloc by 0 (the advised build: +8,927) with THP_enabled
# still 1 in /proc/<pid>/status.
mimalloc = { version = "0.1", features = ["no_thp"] }
# MIT-licensed lossless CST parser; the GPL exclusion applies to snix/tvix
# eval code, not to rnix, which snix merely also uses.
#
# Our patched 0.12, not the crates.io release, because underscore digit
# separators (`1_000`) are this fork's own language extension -- added to the
# cppnix lexer in 8244032f6 and absent from NixOS/nix -- so upstream rnix
# implements the language WITHOUT them, correctly, and always will. Stock rnix
# lexes `1_000` as INTEGER `1` then IDENT `_000`, which is why `compile.rs`
# used to refuse the construct by name rather than mis-evaluate it as an
# application (ENG-12140, ENG-13119). The same tree is what the index
# monorepo overlays onto alejandra, statix and deadnix at build time
# (lib/util/rnix-digit-separators), so that view is the one place the
# dialect's lexer is written down for Rust consumers.
#
# Declared once, in the workspace manifest, as a path to the view. This used
# to be a git rev on a private repository, which made every build of this
# crate a network fetch that no sandbox can make: the CI gate could not build
# the parity lane at all.
rnix = { workspace = true }
rowan = "0.15"

# builtins.match / builtins.split. cppnix compiles these with
# `std::regex::extended`, i.e. POSIX ERE, and the corpus exercises POSIX
# bracket classes ([[:space:]], [[:upper:]]); this crate accepts them, an
# ECMAScript engine does not.
regex = "1"

# builtins.fromJSON / builtins.fromTOML. serde_json keeps the int-vs-float
# distinction cppnix's parser also keeps (1 is an integer, 1.0 a float).
serde_json = "1"
serde = { version = "1", default-features = false, features = ["derive", "std"] }
toml = "1"

# builtins.hashString / hashFile, the five algorithms cppnix's parseHashAlgo accepts.
blake3 = "1"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"

# The memo table and content-addressed store the compile cache lives in.
ix-kernel = { path = "../ix-kernel" }

# rustc's own string hasher, for the symbol interner (ENG-12861). Already in
# this workspace's lock as a dependency of `rowan`, so it adds nothing to the
# build closure. It is here rather than hand-rolled because a hash function is
# a thing to depend on, not a thing to maintain forty lines of.
#
# Not DoS-resistant, deliberately, and that is not a downgrade: cppnix's own
# `SymbolTable` is an unordered container over `std::hash`, so an attacker who
# could pick colliding attribute names already has the same lever there -- and
# anyone who can choose the program text being evaluated can ask for arbitrary
# derivations, which is a larger one.
rustc-hash = "1"

# builtins.wasm: the `env` host interface for evaluation-time plugins (the
# `.ix` converter, packages/ix2nix/wasm). `async` is load-bearing, not a
# style choice: a host call has to suspend the guest while the VM forces a
# thunk or applies a function, and this machine has no host-stack recursion,
# so the guest runs on a wasmtime fiber the continuation polls (src/wasm.rs).
# No `gc`, `component-model` or `wasi`: the protocol is core wasm with one
# import module, and the module bytes are binary (text guests belong to the
# tests: `wat`, below). `parallel-compilation` because the first `.ix` import
# of a process compiles the converter module on the evaluation's critical
# path, once per module hash. The same version as the monorepo's other
# consumer (index/Cargo.toml) so one wasmtime tree serves both.
wasmtime = { version = "46", default-features = false, features = [
  "anyhow",
  "async",
  "cranelift",
  "parallel-compilation",
  "runtime",
  "std",
] }

[dev-dependencies]
# src/wasm.rs's tests write their guests as text and assemble them here; the
# builtin itself takes binary modules only.
wat = "1"
# Examples construct a store directly, and tests/cache_semantics.rs opens one
# to watch a second evaluation hit.
ix-kernel = { path = "../ix-kernel" }

[build-dependencies]
# Fingerprints the crate's own source into the compile-cache key; the same
# hash the kernel uses, so there is one hash in the workspace.
blake3 = "1"

[lints]
workspace = true

# The probe carries a guard test for the one property that makes it honest --
# that it refuses exactly what the embedder refuses -- so its tests run with
# the crate's.
[[example]]
name = "nixpkgs-probe"
test = true

[features]
default = ["perf"]
# The counters that sit in the innermost dispatch loop: the per-op-kind counts
# and the attribute-name intern count, both of which fire millions of times on
# a NixOS toplevel. Opt-in, and the on/off pair in
# maintainers/ix/perf-counter-overhead.md is what justifies keeping them out of
# the default build.
# Implies `perf`: `attr_name_interns` is documented and tested as a subset of
# `interns`, which only holds when both count.
perf-ops = ["perf"]
# All the coarse counters. Default ON, so the shipped binary can answer
# questions about itself; the flag exists so the on/off pair in
# maintainers/ix/perf-counter-overhead.md is a measurement and not an
# argument from the size of a Cell increment.
perf = []
